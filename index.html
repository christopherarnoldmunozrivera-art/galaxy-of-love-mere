<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Mi Mere ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#010006;
    font-family:Arial,Helvetica,sans-serif;
}

canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    display:block;
    cursor:grab;
}

canvas.dragging{
    cursor:grabbing;
}

.title{
    position:fixed;
    top:22px;
    left:50%;
    transform:translateX(-50%);
    z-index:5;

    color:rgba(255,255,255,.72);
    font-size:12px;
    letter-spacing:5px;
    text-transform:uppercase;

    text-shadow:
        0 0 10px rgba(255,60,150,.8),
        0 0 22px rgba(255,40,130,.35);

    pointer-events:none;
}


/* =========================================================
   CONTROLES
========================================================= */

.controls{
    position:fixed;
    right:22px;
    bottom:22px;
    z-index:30;

    display:flex;
    gap:10px;
}

.controlButton{
    width:48px;
    height:48px;

    border-radius:50%;
    border:1px solid rgba(255,100,180,.35);

    background:rgba(255,45,145,.12);
    color:#fff;

    font-size:20px;
    cursor:pointer;

    backdrop-filter:blur(8px);

    box-shadow:
        0 0 12px rgba(255,50,150,.35),
        inset 0 0 12px rgba(255,50,150,.12);

    transition:
        transform .2s ease,
        background .2s ease,
        box-shadow .2s ease;
}

.controlButton:hover{
    transform:scale(1.08);

    background:rgba(255,45,145,.22);

    box-shadow:
        0 0 20px rgba(255,50,150,.55),
        inset 0 0 14px rgba(255,50,150,.18);
}

.controlButton.playing{
    animation:musicPulse 1.6s infinite;
}

@keyframes musicPulse{
    0%,100%{
        box-shadow:
            0 0 12px rgba(255,50,150,.35),
            inset 0 0 12px rgba(255,50,150,.10);
    }

    50%{
        box-shadow:
            0 0 25px rgba(255,50,150,.75),
            inset 0 0 16px rgba(255,50,150,.20);
    }
}


/* =========================================================
   PANEL
========================================================= */

#settingsPanel{
    position:fixed;

    right:22px;
    bottom:82px;

    width:285px;

    padding:18px;

    z-index:29;

    background:rgba(10,3,18,.90);

    border:1px solid rgba(255,80,170,.25);
    border-radius:18px;

    backdrop-filter:blur(14px);

    box-shadow:
        0 0 25px rgba(255,40,140,.22),
        inset 0 0 25px rgba(255,40,140,.05);

    color:#fff;

    opacity:0;

    transform:
        translateY(10px)
        scale(.96);

    pointer-events:none;

    transition:
        opacity .2s ease,
        transform .2s ease;
}

#settingsPanel.show{
    opacity:1;

    transform:
        translateY(0)
        scale(1);

    pointer-events:auto;
}

.settingsTitle{
    text-align:center;

    font-size:15px;
    letter-spacing:2px;

    margin-bottom:18px;

    text-shadow:
        0 0 10px rgba(255,60,150,.6);
}

.setting{
    margin-bottom:18px;
}

.settingLabel{
    display:flex;
    justify-content:space-between;
    align-items:center;

    margin-bottom:8px;

    font-size:12px;

    color:rgba(255,255,255,.82);
}

.value{
    color:rgba(255,150,205,.95);
}


/* =========================================================
   SLIDERS
========================================================= */

input[type="range"]{
    width:100%;
    height:4px;

    appearance:none;
    -webkit-appearance:none;

    background:rgba(255,255,255,.14);

    border-radius:10px;
    outline:none;
}

input[type="range"]::-webkit-slider-thumb{
    appearance:none;
    -webkit-appearance:none;

    width:14px;
    height:14px;

    border-radius:50%;

    background:#ff5aa8;

    border:1px solid rgba(255,255,255,.7);

    box-shadow:
        0 0 10px rgba(255,60,150,.7);

    cursor:pointer;
}

input[type="range"]::-moz-range-thumb{
    width:14px;
    height:14px;

    border-radius:50%;

    background:#ff5aa8;

    border:1px solid rgba(255,255,255,.7);

    box-shadow:
        0 0 10px rgba(255,60,150,.7);

    cursor:pointer;
}


/* =========================================================
   BOTONES DE OPCIONES
========================================================= */

.optionButtons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px;
}

.optionButton{
    padding:9px 6px;

    border-radius:10px;

    border:1px solid rgba(255,100,180,.22);

    background:rgba(255,255,255,.05);

    color:rgba(255,255,255,.82);

    cursor:pointer;

    font-size:11px;

    transition:
        background .2s ease,
        box-shadow .2s ease,
        border-color .2s ease;
}

.optionButton:hover{
    background:rgba(255,70,160,.12);
}

.optionButton.active{
    background:rgba(255,60,150,.18);

    border-color:
        rgba(255,100,180,.55);

    box-shadow:
        0 0 10px
        rgba(255,60,150,.25);
}


/* =========================================================
   ROTACION
========================================================= */

.rotationButton{
    width:100%;

    padding:10px;

    border-radius:11px;

    border:1px solid rgba(255,100,180,.25);

    background:rgba(255,50,150,.10);

    color:#fff;

    cursor:pointer;

    font-size:12px;

    transition:
        background .2s ease,
        box-shadow .2s ease;
}

.rotationButton:hover{
    background:rgba(255,50,150,.18);
}

.rotationButton.on{
    box-shadow:
        0 0 12px rgba(255,50,150,.3);
}


/* =========================================================
   RESTAURAR
========================================================= */

.resetButton{
    width:100%;

    margin-top:10px;

    padding:9px;

    border-radius:10px;

    border:1px solid rgba(255,255,255,.10);

    background:rgba(255,255,255,.05);

    color:rgba(255,255,255,.7);

    cursor:pointer;

    font-size:11px;
}
</style>
</head>

<body>

<div class="title">
    Para mi Mere ❤️
</div>


<!-- =====================================================
     MUSICA
===================================================== -->

<audio
    id="music"
    src="musica.mp3"
    loop
    preload="auto">
</audio>


<!-- =====================================================
     PANEL DE CONFIGURACION
===================================================== -->

<div id="settingsPanel">

    <div class="settingsTitle">
        ⚙️ Configuración
    </div>


    <!-- VELOCIDAD -->

    <div class="setting">

        <div class="settingLabel">

            <span>
                🪐 Velocidad de órbita
            </span>

            <span
                class="value"
                id="speedValue">

            </span>

        </div>

            type="range"

    </div>


    <!-- TAMAÑO -->

    <div class="setting">

        <div class="settingLabel">

            <span>
                ❤️ Corazón principal
            </span>

            <span
                class="value"
                id="heartSizeValue">
                Normal
            </span>

        </div>

        <input
            id="heartSizeSlider"
            type="range"
            min="0.75"
            max="1.35"
            step="0.05"
            value="1">
    </div>


    <!-- COLOR -->

    <div class="setting">

        <div class="settingLabel">

            <span>
                🎨 Color de corazones
            </span>

            <span
                class="value"
                id="heartColorValue">
                Rosa
            </span>

        </div>


        <div class="optionButtons">

            <button
                class="optionButton active"
                data-color="pink">

                💗 Rosa

            </button>

            <button
                class="optionButton"
                data-color="red">

                ❤️ Rojo

            </button>

            <button
                class="optionButton"
                data-color="yellow">

                💛 Amarillo

            </button>

            <button
                class="optionButton"
                data-color="white">

                🤍 Blanco

            </button>

        </div>
    </div>


    <!-- BRILLO ESTRELLAS -->

    <div class="setting">

        <div class="settingLabel">

            <span>
                ✨ Brillo de estrellas
            </span>

            <span
                class="value"
                id="starBrightnessValue">
                Normal
            </span>

        </div>

        <input
            id="starBrightnessSlider"
            type="range"
            min="0.35"
            max="2"
            step="0.05"
            value="1">
    </div>


    <!-- ROTACION -->

    <div class="setting">

        <div class="settingLabel">

            <span>
                🔄 Rotación automática
            </span>

        </div>

        <button
            id="rotationButton"
            class="rotationButton on">

            🔄 Rotación automática: ON

        </button>

    </div>


    <!-- RESTAURAR -->

    <button
        id="resetButton"
        class="resetButton">

        ↩️ Restaurar configuración

    </button>

</div>


<!-- =====================================================
     CONTROLES
===================================================== -->

<div class="controls">

    <button
        id="musicButton"
        class="controlButton"
        aria-label="Reproducir música">

        ♫

    </button>

    <button
        id="settingsButton"
        class="controlButton"
        aria-label="Configuración">

        ⚙️

    </button>

</div>


<canvas id="galaxy"></canvas>


<script>

/* =========================================================
   CANVAS
========================================================= */

const canvas =
    document.getElementById("galaxy");

const ctx =
    canvas.getContext(
        "2d",
        {
            alpha:false,
            desynchronized:true
        }
    );

let W = 0;
let H = 0;
let DPR = 1;


/* =========================================================
   CONFIGURACION
========================================================= */

const settings = {

    orbitSpeed:2,

    heartSize:1,

    autoRotation:true,

    heartColor:"pink",

    starBrightness:1
};


/* =========================================================
   COLORES DE CORAZON
========================================================= */

const heartColors = {

    pink:{
        fill:"rgba(255,55,150,.90)",
        shadow:"rgba(255,55,150,.60)"
    },

    red:{
        fill:"rgba(255,40,65,.92)",
        shadow:"rgba(255,30,50,.62)"
    },

    yellow:{
        fill:"rgba(255,210,55,.92)",
        shadow:"rgba(255,190,30,.62)"
    },

    white:{
        fill:"rgba(255,255,255,.94)",
        shadow:"rgba(255,255,255,.55)"
    }
};


/* =========================================================
   CAMARA
========================================================= */

const camera = {

    yaw:0,

    pitch:0.12,

    distance:1,

    targetDistance:1
};


/* =========================================================
   RESOLUCION
========================================================= */

function resize(){

    W =
        window.innerWidth;

    H =
        window.innerHeight;

    DPR =
        Math.min(
            window.devicePixelRatio || 1,
            1.15
        );

    canvas.width =
        W * DPR;

    canvas.height =
        H * DPR;

    canvas.style.width =
        W + "px";

    canvas.style.height =
        H + "px";

    ctx.setTransform(
        DPR,
        0,
        0,
        DPR,
        0,
        0
    );

    createStars();

    createHearts();

    createCentralHeart();

    createLoveTexts();
}

window.addEventListener(
    "resize",
    resize
);


/* =========================================================
   MOUSE
========================================================= */

let dragging = false;

let lastX = 0;
let lastY = 0;


canvas.addEventListener(
    "mousedown",
    e => {

        dragging = true;

        canvas.classList.add(
            "dragging"
        );

        lastX = e.clientX;

        lastY = e.clientY;
    }
);


window.addEventListener(
    "mouseup",
    () => {

        dragging = false;

        canvas.classList.remove(
            "dragging"
        );
    }
);


window.addEventListener(
    "mousemove",
    e => {

        if(!dragging)
            return;

        const dx =
            e.clientX -
            lastX;

        const dy =
            e.clientY -
            lastY;

        lastX =
            e.clientX;

        lastY =
            e.clientY;

        camera.yaw -=
            dx * 0.008;

        camera.pitch -=
            dy * 0.006;

        camera.pitch =
            Math.max(
                -1.35,
                Math.min(
                    1.35,
                    camera.pitch
                )
            );
    }
);


/* =========================================================
   ZOOM
========================================================= */

canvas.addEventListener(
    "wheel",
    e => {

        e.preventDefault();

        camera.targetDistance +=
            e.deltaY * 0.0012;

        camera.targetDistance =
            Math.max(
                0.38,
                Math.min(
                    2.7,
                    camera.targetDistance
                )
            );

    },
    {
        passive:false
    }
);


/* =========================================================
   FORMA DEL CORAZON
========================================================= */

function heartPoint(
    t,
    scale
){

    const x =
        16 *
        Math.pow(
            Math.sin(t),
            3
        );

    const y =
        13 * Math.cos(t)
        -5 * Math.cos(2*t)
        -2 * Math.cos(3*t)
        -Math.cos(4*t);

    return{

        x:
            x * scale,

        y:
            -y * scale
    };
}


/* =========================================================
   PARTICULAS DEL CORAZON
========================================================= */

function createHeartParticles(
    scale,
    amount
){

    const particles =
        new Array(amount);

    for(
        let i=0;
        i<amount;
        i++
    ){

        const t =
            Math.random() *
            Math.PI * 2;

        const p =
            heartPoint(
                t,
                scale
            );

        const p2 =
            heartPoint(
                t + 0.015,
                scale
            );

        const dx =
            p2.x-p.x;

        const dy =
            p2.y-p.y;

        const len =
            Math.sqrt(
                dx*dx+
                dy*dy
            ) || 1;

        const nx =
            -dy/len;

        const ny =
            dx/len;

        const thickness =
            (
                Math.random()-.5
            ) *
            scale *
            .72;

        particles[i]={

            x:
                p.x+
                nx*thickness,

            y:
                p.y+
                ny*thickness,

            size:
                Math.random()*
                .70+
                .30,

            alpha:
                Math.random()*
                .55+
                .35
        };
    }

    return particles;
}


/* =========================================================
   PARTICULAS DECORATIVAS
========================================================= */

const accentColors = [

    "rgba(80,180,255,.80)",

    "rgba(100,220,255,.75)",

    "rgba(170,100,255,.70)",

    "rgba(255,80,180,.72)",

    "rgba(120,120,255,.70)"
];


function createAccentParticles(
    radius,
    amount
){

    const particles =
        new Array(amount);

    for(
        let i=0;
        i<amount;
        i++
    ){

        const angle =
            Math.random()*
            Math.PI*2;

        const distance =
            radius*
            (
                .35+
                Math.random()*.65
            );

        particles[i]={

            x:
                Math.cos(angle)*
                distance,

            y:
                Math.sin(angle)*
                distance*.62,

            size:
                Math.random()*
                1.25+
                .45,

            color:
                accentColors[
                    Math.floor(
                        Math.random()*
                        accentColors.length
                    )
                ],

            alpha:
                Math.random()*
                .35+
                .30
        };
    }

    return particles;
}


/* =========================================================
   CORAZON CENTRAL
========================================================= */

const centralHeart = {

    particles:[],

    accentParticles:[],

    scale:1
};


function createCentralHeart(){

    const scale =
        Math.min(W,H)*
        .014*
        settings.heartSize;

    centralHeart.scale =
        scale;

    centralHeart.particles =
        createHeartParticles(
            scale,
            1000
        );

    centralHeart.accentParticles =
        createAccentParticles(
            Math.min(W,H)*
            .035*
            settings.heartSize,

            65
        );
}


/* =========================================================
   17 CORAZONES
========================================================= */

const orbitHearts = [];


function createHearts(){

    orbitHearts.length=0;

    const count=17;

    const radius =
        Math.min(W,H)*.34;

    const smallScale =
        Math.min(W,H)*.0048;

    for(
        let i=0;
        i<count;
        i++
    ){

        orbitHearts.push({

            angle:
                Math.PI*
                2/count*
                i,

            radius,

            particles:
                createHeartParticles(
                    smallScale,
                    330
                ),

            accentParticles:
                createAccentParticles(
                    Math.min(W,H)*
                    .010,

                    18
                )
        });
    }
}


/* =========================================================
   FRASES
========================================================= */

const loveWords=[

    "Mi princesa ❤️",
    "Mi niña 🥰",
    "Mi cielo 💍",
    "Mi corazón ❤️",
    "Mi amor 💗",
    "Mi ángel 😇",
    "Mi cuchurrumina 🥺",
    "Mi terroncito de azúcar 🍬",
    "Mi vida 💕",
    "Mi bonita 🌷",
    "Mi hermosa 💖",
    "Mi reina 👑",
    "Mi preciosa 💎",
    "Mi todo ❤️",
    "Amor mío 💕",
    "Mi muñequita 🎀",
    "Mi felicidad ☀️",
    "Mi bebé 🥺",
    "Mi niña hermosa 🌸",
    "Mi amorcito 💗",
    "Mi tesoro 💎",
    "Mi estrellita ⭐",
    "Mi princesa hermosa 👑",
    "Mi consentida 🥰",
    "Mi mundo 🌎",
    "Mi razón ❤️",
    "Mi dulzura 🍯",
    "Mi bonita 💐",
    "Mi compañera 🫶",
    "Mi persona favorita ❤️",
    "Mi sueño ✨",
    "Mi luna 🌙",
    "Mi sol ☀️",
    "Mi flor 🌹",
    "Mi pequeña 🥺",
    "Mi amor eterno 💍",
    "Mi hogar 🏠",
    "Mi locura 😍",
    "Mi paz 🕊️",
    "Mi alegría 🌷"
];

const loveTexts=[];


function createLoveTexts(){

    loveTexts.length=0;

    const base =
        Math.min(W,H);

    loveWords.forEach(
        text=>{

            const radius =
                base*
                (
                    .42+
                    Math.random()*
                    .58
                );

            const y =
                (
                    Math.random()-.5
                )*
                base*.60;

            const speed =
                .00008+
                Math.random()*.00024;

            loveTexts.push({

                text,

                angle:
                    Math.random()*
                    Math.PI*2,

                radius,

                y,

                speed
            });
        }
    );
}


/* =========================================================
   ESTRELLAS
========================================================= */

let stars=[];


function createStars(){

    stars.length=0;

    const amount =
        Math.max(
            600,
            Math.floor(W*H/1800)
        );

    for(
        let i=0;
        i<amount;
        i++
    ){

        const theta =
            Math.random()*
            Math.PI*2;

        const phi =
            Math.acos(
                2*Math.random()-1
            );

        const radius =
            Math.min(W,H)*
            (
                .25+
                Math.random()*1.6
            );

        stars.push({

            theta,

            phi,

            radius,

            size:
                Math.random()*
                2.4+.7,

            alpha:
                Math.random()*
                .65+.3,

            twinkle:
                Math.random()*6.283
        });
    }
}


/* =========================================================
   PROYECCION
========================================================= */

function project3D(
    x,
    y,
    z
){

    const cy =
        Math.cos(camera.yaw);

    const sy =
        Math.sin(camera.yaw);

    let rx =
        x*cy-
        z*sy;

    let rz =
        x*sy+
        z*cy;


    const cp =
        Math.cos(camera.pitch);

    const sp =
        Math.sin(camera.pitch);

    let ry =
        y*cp-
        rz*sp;

    rz =
        y*sp+
        rz*cp;


    rz -=
        camera.distance*
        Math.min(W,H)*
        .7;


    const focal =
        Math.min(W,H)*
        .75;

    const scale =
        focal/
        Math.max(
            1,
            -rz
        );

    return{

        x:
            W/2+
            rx*scale,

        y:
            H/2+
            ry*scale,

        scale,

        depth:rz
    };
}


/* =========================================================
   ESTRELLAS
========================================================= */

function drawStars(time){

    const cosYaw =
        Math.cos(camera.yaw);

    const sinYaw =
        Math.sin(camera.yaw);

    const cosPitch =
        Math.cos(camera.pitch);

    const sinPitch =
        Math.sin(camera.pitch);


    const galaxyTime =
        settings.autoRotation
            ? time
            : 0;


    for(
        const star of stars
    ){

        const theta =
            star.theta+
            galaxyTime*.000045;


        const sinPhi =
            Math.sin(star.phi);

        const cosTheta =
            Math.cos(theta);

        const sinTheta =
            Math.sin(theta);


        let x =
            sinPhi*
            cosTheta*
            star.radius;

        let y =
            Math.cos(
                star.phi
            )*
            star.radius;

        let z =
            sinPhi*
            sinTheta*
            star.radius;


        const rx =
            x*cosYaw-
            z*sinYaw;

        let rz =
            x*sinYaw+
            z*cosYaw;


        const ry =
            y*cosPitch-
            rz*sinPitch;

        rz =
            y*sinPitch+
            rz*cosPitch;


        rz -=
            camera.distance*
            Math.min(W,H)*
            .7;


        const scale =
            Math.min(W,H)*
            .75/
            Math.max(
                1,
                -rz
            );


        const px =
            W/2+
            rx*scale;

        const py =
            H/2+
            ry*scale;


        if(
            px<-10 ||
            px>W+10 ||
            py<-10 ||
            py>H+10
        ) continue;


        const twinkle =
            .75+
            Math.sin(
                time*.002+
                star.twinkle
            )*.25;


        const brightness =
            settings.starBrightness;


        const size =
            Math.max(
                .6,
                star.size*
                scale*
                1.8*
                Math.min(
                    1.25,
                    .85+
                    brightness*.15
                )
            );


        ctx.globalAlpha =
            Math.min(
                1,
                star.alpha*
                twinkle*
                brightness
            );


        ctx.save();

        ctx.translate(
            px,
            py
        );

        ctx.rotate(
            Math.PI/4
        );

        ctx.fillStyle =
            "#ffffff";


        /*
           Un pequeño halo solo para
           las estrellas grandes.
        */

        if(
            brightness>1.35 &&
            size>1.5
        ){

            ctx.shadowColor =
                "#ffffff";

            ctx.shadowBlur =
                Math.min(
                    7,
                    size*
                    brightness
                );
        }


        ctx.fillRect(
            -size/2,
            -size/2,
            size,
            size
        );


        ctx.restore();
    }

    ctx.globalAlpha=1;
}


/* =========================================================
   HALO
========================================================= */

function drawGlow(){

    const radius =
        Math.min(W,H)*
        .20/
        camera.distance;

    const gradient =
        ctx.createRadialGradient(
            W/2,
            H/2,
            0,
            W/2,
            H/2,
            radius
        );

    gradient.addColorStop(
        0,
        "rgba(255,35,130,.16)"
    );

    gradient.addColorStop(
        .4,
        "rgba(255,25,120,.06)"
    );

    gradient.addColorStop(
        1,
        "rgba(0,0,0,0)"
    );

    ctx.fillStyle=
        gradient;

    ctx.beginPath();

    ctx.arc(
        W/2,
        H/2,
        radius,
        0,
        Math.PI*2
    );

    ctx.fill();
}


/* =========================================================
   ORBITA
========================================================= */

function drawOrbit(){

    const radius =
        Math.min(W,H)*.34;

    const points=70;

    ctx.beginPath();

    for(
        let i=0;
        i<=points;
        i++
    ){

        const a =
            i/points*
            Math.PI*2;

        const p =
            project3D(
                Math.cos(a)*
                radius,

                0,

                Math.sin(a)*
                radius
            );

        if(i===0)
            ctx.moveTo(
                p.x,
                p.y
            );
        else
            ctx.lineTo(
                p.x,
                p.y
            );
    }

    ctx.strokeStyle=
        "rgba(255,60,150,.08)";

    ctx.lineWidth=1;

    ctx.stroke();
}


/* =========================================================
   PARTICULAS DEL CORAZON
========================================================= */

function drawHeartParticles(
    particles,
    position,
    rotation
){

    const scale=
        position.scale;

    const color=
        heartColors[
            settings.heartColor
        ];


    ctx.save();

    ctx.translate(
        position.x,
        position.y
    );

    ctx.rotate(
        rotation
    );


    ctx.fillStyle=
        color.fill;


    for(
        const p of particles
    ){

        const x=
            p.x*scale;

        const y=
            p.y*scale;

        const size=
            Math.max(
                .25,
                p.size*
                scale*
                1.7
            );


        ctx.globalAlpha=
            p.alpha;


        ctx.beginPath();

        ctx.arc(
            x,
            y,
            size,
            0,
            Math.PI*2
        );

        ctx.fill();
    }


    ctx.globalAlpha=1;

    ctx.restore();
}


/* =========================================================
   PARTICULAS DE COLOR
========================================================= */

function drawAccentParticles(
    particles,
    position
){

    const scale=
        position.scale;

    ctx.save();

    ctx.translate(
        position.x,
        position.y
    );


    for(
        const p of particles
    ){

        const size=
            Math.max(
                .35,
                p.size*
                scale
            );


        ctx.globalAlpha=
            p.alpha;

        ctx.fillStyle=
            p.color;


        ctx.beginPath();

        ctx.arc(
            p.x*scale,
            p.y*scale,
            size,
            0,
            Math.PI*2
        );

        ctx.fill();
    }


    ctx.globalAlpha=1;

    ctx.restore();
}


/* =========================================================
   TE AMO
========================================================= */

function drawHeartText(
    text,
    position
){

    const scale=
        position.scale;

    const size=
        Math.max(
            4.5,
            7*scale
        );


    ctx.save();

    ctx.translate(
        position.x,
        position.y
    );

    ctx.textAlign=
        "center";

    ctx.textBaseline=
        "middle";


    ctx.font=
        `normal ${size}px "Meredith",
        "Segoe Script",
        "Brush Script MT",
        cursive`;


    ctx.fillStyle=
        "#ffffff";


    ctx.shadowColor=
        heartColors[
            settings.heartColor
        ].shadow;


    ctx.shadowBlur=
        Math.min(
            5,
            size*.35
        );


    ctx.fillText(
        text,
        0,
        0
    );


    ctx.restore();
}


/* =========================================================
   17 CORAZONES
========================================================= */

function drawOrbitHearts(time){

    const list=[];


    let orbitTime=
        settings.autoRotation
            ? time
            : 0;


    let speedMultiplier;


    if(
        settings.orbitSpeed===0
    ){

        speedMultiplier=.35;

    }else if(
        settings.orbitSpeed===1
    ){

        speedMultiplier=.70;

    }else if(
        settings.orbitSpeed===2
    ){

        speedMultiplier=1;

    }else{

        speedMultiplier=2;
    }


    const orbitSpeed=
        orbitTime*
        .00035*
        speedMultiplier;


    const cosYaw=
        Math.cos(
            camera.yaw
        );

    const sinYaw=
        Math.sin(
            camera.yaw
        );


    const cosPitch=
        Math.cos(
            camera.pitch
        );

    const sinPitch=
        Math.sin(
            camera.pitch
        );


    for(
        const heart of orbitHearts
    ){

        const angle=
            heart.angle+
            orbitSpeed;


        const x=
            Math.cos(angle)*
            heart.radius;

        const y=0;

        const z=
            Math.sin(angle)*
            heart.radius;


        const rx=
            x*cosYaw-
            z*sinYaw;

        let rz=
            x*sinYaw+
            z*cosYaw;


        const ry=
            y*cosPitch-
            rz*sinPitch;


        rz=
            y*sinPitch+
            rz*cosPitch;


        rz -=
            camera.distance*
            Math.min(W,H)*
            .7;


        const scale=
            Math.min(W,H)*
            .75/
            Math.max(
                1,
                -rz
            );


        list.push({

            heart,

            depth:rz,

            position:{

                x:
                    W/2+
                    rx*scale,

                y:
                    H/2+
                    ry*scale,

                scale
            }
        });
    }


    list.sort(
        (a,b)=>
            b.depth-a.depth
    );


    for(
        const item of list
    ){

        drawHeartParticles(
            item.heart.particles,
            item.position,
            0
        );


        drawAccentParticles(
            item.heart.accentParticles,
            item.position
        );


        drawHeartText(
            "Te amo",
            item.position
        );
    }
}


/* =========================================================
   TEXTOS EXTERIORES
========================================================= */

function drawLoveTexts(time){

    const list=[];


    const cosYaw=
        Math.cos(camera.yaw);

    const sinYaw=
        Math.sin(camera.yaw);

    const cosPitch=
        Math.cos(camera.pitch);

    const sinPitch=
        Math.sin(camera.pitch);


    const textTime=
        settings.autoRotation
            ? time
            : 0;


    for(
        const item of loveTexts
    ){

        const angle=
            item.angle+
            textTime*
            item.speed;


        const x=
            Math.cos(angle)*
            item.radius;

        const y=
            item.y;

        const z=
            Math.sin(angle)*
            item.radius;


        const rx=
            x*cosYaw-
            z*sinYaw;


        let rz=
            x*sinYaw+
            z*cosYaw;


        const ry=
            y*cosPitch-
            rz*sinPitch;


        rz=
            y*sinPitch+
            rz*cosPitch;


        rz -=
            camera.distance*
            Math.min(W,H)*
            .7;


        const scale=
            Math.min(W,H)*
            .75/
            Math.max(
                1,
                -rz
            );


        const position={

            x:
                W/2+
                rx*scale,

            y:
                H/2+
                ry*scale,

            scale,

            depth:rz
        };


        list.push({

            item,

            position
        });
    }


    list.sort(
        (a,b)=>
            b.position.depth-
            a.position.depth
    );


    for(
        const obj of list
    ){

        const p=
            obj.position;


        const size=
            Math.max(
                5,
                Math.min(
                    14,
                    8*p.scale
                )
            );


        if(
            p.x<-100 ||
            p.x>W+100 ||
            p.y<-100 ||
            p.y>H+100
        ) continue;


        ctx.save();


        ctx.textAlign=
            "center";

        ctx.textBaseline=
            "middle";


        ctx.font=
            `normal ${size}px Arial`;


        ctx.fillStyle=
            "rgba(255,205,225,.86)";


        ctx.shadowColor=
            "rgba(255,50,145,.65)";


        ctx.shadowBlur=
            Math.min(
                6,
                size*.45
            );


        ctx.fillText(
            obj.item.text,
            p.x,
            p.y
        );


        ctx.restore();
    }
}


/* =========================================================
   CORAZON CENTRAL
========================================================= */

function drawCentralHeart(){

    const position={

        x:
            W/2,

        y:
            H/2,

        scale:
            Math.min(W,H)*
            .00145*
            settings.heartSize/
            camera.distance
    };


    drawHeartParticles(
        centralHeart.particles,
        position,
        0
    );


    drawAccentParticles(
        centralHeart.accentParticles,
        position
    );


    /*
       MISMA LOGICA QUE TE AMO
    */

    ctx.save();


    const size=
        Math.max(
            4.5,
            9*position.scale
        );


    ctx.translate(
        position.x,
        position.y
    );


    ctx.textAlign=
        "center";

    ctx.textBaseline=
        "middle";


    ctx.font=
        `normal ${size}px "Meredith",
        "Segoe Script",
        "Brush Script MT",
        cursive`;


    ctx.fillStyle=
        "#ffffff";


    ctx.shadowColor=
        heartColors[
            settings.heartColor
        ].shadow;


    ctx.shadowBlur=
        Math.min(
            6,
            size*.4
        );


    ctx.fillText(
        "Mi Mere ❤️",
        0,
        0
    );


    ctx.restore();
}


/* =========================================================
   MUSICA
========================================================= */

const music=
    document.getElementById(
        "music"
    );

const musicButton=
    document.getElementById(
        "musicButton"
    );

let musicPlaying=false;


musicButton.addEventListener(
    "click",
    async()=>{

        try{

            if(!musicPlaying){

                await music.play();

                musicPlaying=true;

                musicButton.textContent=
                    "❚❚";

                musicButton.classList.add(
                    "playing"
                );

            }else{

                music.pause();

                musicPlaying=false;

                musicButton.textContent=
                    "♫";

                musicButton.classList.remove(
                    "playing"
                );
            }

        }catch(error){

            console.error(
                "No se pudo reproducir la música:",
                error
            );
        }
    }
);


/* =========================================================
   PANEL
========================================================= */

const settingsButton=
    document.getElementById(
        "settingsButton"
    );

const settingsPanel=
    document.getElementById(
        "settingsPanel"
    );

const speedSlider=
    document.getElementById(
        "speedSlider"
    );

const heartSizeSlider=
    document.getElementById(
        "heartSizeSlider"
    );

const rotationButton=
    document.getElementById(
        "rotationButton"
    );

const speedValue=
    document.getElementById(
        "speedValue"
    );

const heartSizeValue=
    document.getElementById(
        "heartSizeValue"
    );

const resetButton=
    document.getElementById(
        "resetButton"
    );

const starBrightnessSlider=
    document.getElementById(
        "starBrightnessSlider"
    );

const starBrightnessValue=
    document.getElementById(
        "starBrightnessValue"
    );

const heartColorValue=
    document.getElementById(
        "heartColorValue"
    );

const colorButtons=
    document.querySelectorAll(
        "[data-color]"
    );


/* =========================================================
   ABRIR PANEL
========================================================= */

settingsButton.addEventListener(
    "click",
    ()=>{
        settingsPanel.classList.toggle(
            "show"
        );
    }
);


/* =========================================================
   VELOCIDAD
========================================================= */

function updateSpeedLabel(){

    const labels=[

        "Muy lenta",

        "Lenta",

        "Normal",

        "Rápida"
    ];


    speedValue.textContent=
        labels[
            settings.orbitSpeed
        ];
}


speedSlider.addEventListener(
    "input",
    ()=>{

        settings.orbitSpeed=
            Number(
                speedSlider.value
            );

        updateSpeedLabel();
    }
);


/* =========================================================
   TAMAÑO DEL CORAZON
========================================================= */

function updateHeartSizeLabel(){

    const value=
        settings.heartSize;


    if(value<.9){

        heartSizeValue.textContent=
            "Pequeño";

    }else if(value>1.15){

        heartSizeValue.textContent=
            "Grande";

    }else{

        heartSizeValue.textContent=
            "Normal";
    }
}


heartSizeSlider.addEventListener(
    "input",
    ()=>{

        settings.heartSize=
            Number(
                heartSizeSlider.value
            );

        createCentralHeart();

        updateHeartSizeLabel();
    }
);


/* =========================================================
   COLOR DE CORAZONES
========================================================= */

const colorNames={

    pink:"Rosa",

    red:"Rojo",

    yellow:"Amarillo",

    white:"Blanco"
};


colorButtons.forEach(
    button=>{

        button.addEventListener(
            "click",
            ()=>{

                const color=
                    button.dataset.color;


                settings.heartColor=
                    color;


                colorButtons.forEach(
                    item=>{

                        item.classList.toggle(
                            "active",
                            item.dataset.color===
                            color
                        );
                    }
                );


                heartColorValue.textContent=
                    colorNames[color];
            }
        );
    }
);


/* =========================================================
   BRILLO ESTRELLAS
========================================================= */

function updateStarBrightnessLabel(){

    const value=
        settings.starBrightness;


    if(value<.75){

        starBrightnessValue.textContent=
            "Bajo";

    }else if(value<1.2){

        starBrightnessValue.textContent=
            "Normal";

    }else if(value<1.65){

        starBrightnessValue.textContent=
            "Alto";

    }else{

        starBrightnessValue.textContent=
            "Muy alto";
    }
}


starBrightnessSlider.addEventListener(
    "input",
    ()=>{

        settings.starBrightness=
            Number(
                starBrightnessSlider.value
            );

        updateStarBrightnessLabel();
    }
);


/* =========================================================
   ROTACION AUTOMATICA
========================================================= */

function updateRotationButton(){

    if(settings.autoRotation){

        rotationButton.textContent=
            "🔄 Rotación automática: ON";

        rotationButton.classList.add(
            "on"
        );

    }else{

        rotationButton.textContent=
            "⏸️ Rotación automática: OFF";

        rotationButton.classList.remove(
            "on"
        );
    }
}


rotationButton.addEventListener(
    "click",
    ()=>{

        settings.autoRotation=
            !settings.autoRotation;

        updateRotationButton();
    }
);


/* =========================================================
   RESTAURAR
========================================================= */

resetButton.addEventListener(
    "click",
    ()=>{

        settings.orbitSpeed=2;

        settings.heartSize=1;

        settings.autoRotation=true;

        settings.heartColor="pink";

        settings.starBrightness=1;


        speedSlider.value=2;

        heartSizeSlider.value=1;

        starBrightnessSlider.value=1;


        colorButtons.forEach(
            button=>{

                button.classList.toggle(
                    "active",
                    button.dataset.color===
                    "pink"
                );
            }
        );


        createCentralHeart();

        updateSpeedLabel();

        updateHeartSizeLabel();

        updateStarBrightnessLabel();

        updateRotationButton();

        heartColorValue.textContent=
            "Rosa";
    }
);


/* =========================================================
   VALORES INICIALES
========================================================= */

updateSpeedLabel();

updateHeartSizeLabel();

updateStarBrightnessLabel();

updateRotationButton();


/* =========================================================
   ANIMACION
========================================================= */

function animate(time){

    camera.distance +=
        (
            camera.targetDistance-
            camera.distance
        )*.06;


    ctx.globalAlpha=1;


    ctx.fillStyle=
        "#010006";


    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    drawStars(time);

    drawGlow();

    drawOrbit();

    drawLoveTexts(time);

    drawOrbitHearts(time);

    drawCentralHeart();


    requestAnimationFrame(
        animate
    );
}


/* =========================================================
   INICIAR
========================================================= */

resize();

requestAnimationFrame(
    animate
);

</script>
